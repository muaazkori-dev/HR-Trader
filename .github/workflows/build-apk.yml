name: Build Customer App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: apps/customer_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HR-Traders-Customer-App
          path: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HR Traders Customer App v1.0.${{ github.run_number }} (Release APK)"
          body: |
            ### 🛒 HR Traders - Online Grocery Customer Mobile App
            Official Release APK build for Android devices.

            - **App:** HR Traders Customer App
            - **Target:** Android (ARM64 / ARMv7 / x86_64 universal)
            - **Features:** Catalog browsing, Live GPS Pinning, Cart, WhatsApp checkout & Live Order Tracking.
          files: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
