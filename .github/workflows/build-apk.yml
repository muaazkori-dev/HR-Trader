name: Build Mobile Apps (Customer & Rider)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Compile Customer & Rider Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 1. BUILD CUSTOMER MOBILE APP
      - name: Install Customer App Dependencies
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Build Customer App Release APK
        working-directory: apps/customer_app
        run: flutter build apk --release --no-tree-shake-icons

      # 2. BUILD RIDER DELIVERY APP
      - name: Install Rider App Dependencies
        working-directory: apps/rider_app
        run: flutter pub get

      - name: Build Rider App Release APK
        working-directory: apps/rider_app
        run: flutter build apk --release --no-tree-shake-icons

      # 3. PREPARE RELEASE ARTIFACTS
      - name: Package Release Files
        run: |
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk hr-traders-customer.apk
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk app-release.apk
          cp apps/rider_app/build/app/outputs/flutter-apk/app-release.apk hr-traders-rider.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HR-Traders-Apps
          path: |
            hr-traders-customer.apk
            hr-traders-rider.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HR Traders Apps v1.0.${{ github.run_number }} (Customer & Rider APKs)"
          body: |
            ### 🚀 HR Traders Mobile Apps Release
            Official Release APK builds for Android devices.

            #### 🛒 1. Customer Mobile App
            - File: `hr-traders-customer.apk` (and `app-release.apk`)
            - Real-time catalog, instant CDN images, live GPS drop-pin, order tracking.

            #### 🛵 2. Rider Delivery App
            - File: `hr-traders-rider.apk`
            - Live delivery orders feed, 1-tap Google Maps bike navigation, 1-tap customer call/WhatsApp, cash on delivery (COD) ledger.
          files: |
            hr-traders-customer.apk
            hr-traders-rider.apk
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
