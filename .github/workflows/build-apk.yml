name: Build Mobile Apps (Customer, Rider & Admin)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apks:
    name: Compile Ecosystem Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # 1. BUILD CUSTOMER MOBILE APP
      - name: Install Customer App Dependencies
        working-directory: apps/customer_app
        run: flutter pub get

      - name: Build Customer App Release APK
        working-directory: apps/customer_app
        run: flutter build apk --release --no-tree-shake-icons

      # 2. BUILD RIDER DELIVERY APP
      - name: Install Rider App Dependencies
        working-directory: apps/rider_app
        run: flutter pub get

      - name: Build Rider App Release APK
        working-directory: apps/rider_app
        run: flutter build apk --release --no-tree-shake-icons

      # 3. BUILD STORE OWNER / ADMIN APP
      - name: Install Admin App Dependencies
        working-directory: apps/admin_app
        run: flutter pub get

      - name: Build Admin App Release APK
        working-directory: apps/admin_app
        run: flutter build apk --release --no-tree-shake-icons

      # 4. PREPARE RELEASE ARTIFACTS
      - name: Package Release Files
        run: |
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk hr-traders-customer.apk
          cp apps/customer_app/build/app/outputs/flutter-apk/app-release.apk app-release.apk
          cp apps/rider_app/build/app/outputs/flutter-apk/app-release.apk hr-traders-rider.apk
          cp apps/admin_app/build/app/outputs/flutter-apk/app-release.apk hr-traders-admin.apk

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HR-Traders-Apps
          path: |
            hr-traders-customer.apk
            hr-traders-rider.apk
            hr-traders-admin.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HR Traders Apps v1.0.${{ github.run_number }} (Customer, Rider & Admin APKs)"
          body: |
            ### 🚀 HR Traders 3-App Mobile Ecosystem Release
            Official Release APK builds for Android devices.

            #### 🛒 1. Customer Mobile App
            - File: `hr-traders-customer.apk`
            - Online groceries catalog, dynamic CDN resizing, live GPS location pinning, order tracking.

            #### 🛵 2. Rider Delivery App
            - File: `hr-traders-rider.apk`
            - Live deliveries feed, 1-tap Google Maps bike navigation, 1-tap customer call/WhatsApp, cash collection ledger.

            #### 🏪 3. Store Owner / Admin App
            - File: `hr-traders-admin.apk`
            - Gross sales & revenue metrics, live orders desk with audible chime alerts, walk-in counter POS billing desk, 381+ product inventory manager with 1-tap stock switch, customer demands desk & store settings.
          files: |
            hr-traders-customer.apk
            hr-traders-rider.apk
            hr-traders-admin.apk
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
